---
layout: default
---
<div class="about-wrap">
  <div class="about-banner">
    <img class="about-emblem-img" src="{{ site.logo | relative_url }}" alt="{{ site.title }}">
    <div class="about-banner-text">
      <h1 style="font-family:var(--font-ui);font-size:24px;letter-spacing:1.5px;color:var(--white);margin-bottom:6px;font-weight:400;">{{ site.title }}</h1>
      <p>{{ page.banner_text }}</p>
    </div>
  </div>
  <div class="about-content">
    {{ content }}
  </div>
</div>
